######################################
# 	        Daylight config          #
######################################
[neopixel Dayligth]
pin: PD15
chain_count: 36
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[gcode_macro Set_Daylight_On]
gcode:
    SET_LED LED="Dayligth" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1

[gcode_macro Set_Daylight_Off]
gcode:
    SET_LED LED="Dayligth" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1